openapi: 3.2.0
info:
  title: Document Reader API
  description: >
    PDF extraction and AI-assisted Word (.docx) generation. APIs follow project OpenAPI 3.2.0 policy.
    For end-user "local folder" saves in cloud deployments, clients SHOULD persist response bodies
    using the provided filename (Content-Disposition).
  version: 0.1.0

servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://api.example.com
    description: Production (replace with deployment host)

tags:
  - name: Pdf
    description: PDF retrieval and text extraction
  - name: Documents
    description: Word document generation

paths:
  /api/v1/pdf/extract:
    post:
      tags: [Pdf]
      operationId: extractPdfText
      summary: Download a PDF from a URL and return extracted text
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtractPdfRequest'
      responses:
        '200':
          description: PDF retrieved and text extracted (may be empty if image-only)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractPdfResponse'
        '400':
          description: Invalid URL or not a PDF
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '413':
          description: PDF exceeds configured size limit
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '502':
          description: Upstream fetch failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/documents/word:
    post:
      tags: [Documents]
      operationId: generateWordDocument
      summary: Generate a .docx from a prompt; optional PDF text context
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateWordRequest'
      responses:
        '200':
          description: Word document bytes
          headers:
            Content-Disposition:
              description: Attachment filename for local save
              schema:
                type: string
          content:
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
        '400':
          description: Validation error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Generation refused (e.g. safety policy)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: AI provider unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

components:
  schemas:
    ExtractPdfRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
          description: HTTP(S) URL referencing a PDF resource

    ExtractPdfResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [READY, FAILED]
        extractedText:
          type: string
          description: Extracted plain text; may be empty
        warnings:
          type: array
          items:
            type: string
        message:
          type: string
          description: Present when status is FAILED or for additional context

    GenerateWordRequest:
      type: object
      required: [prompt]
      properties:
        prompt:
          type: string
          description: User instructions for the written output
        pdfContextText:
          type: string
          description: Optional extracted PDF text; when omitted, generation uses prompt only
        usePdfContext:
          type: boolean
          default: true
          description: When false, ignore pdfContextText even if provided
        fileName:
          type: string
          description: Desired base filename (must end with .docx); server may sanitize
          example: report.docx

    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
